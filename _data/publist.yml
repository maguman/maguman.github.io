- title: "Nonlinear inversion in the scattering-source space"
  journal: Manuscript in Preparation
  volume: 
  doi: 
  year: Hopefully 2027
  image: SSS.png
  description: 
  key1: Conventional Born-approximation-based linearized inversion neglects higher-order sensitivities, often producing nonlinearity artifacts and limiting convergence and resolution.
  key2: We introduce a scattering-source space and a nonlinear sensitivity operator to quantify and directly incorporate nonlinear effects into the inversion formulation.
  key3: We apply the method to geophysical field data to resolve seismogenic fault structures and demonstrate its superiority over conventional methods.
  authors: <strong>Yonghyun Chung</strong>
