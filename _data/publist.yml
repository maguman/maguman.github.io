- title: "Efficient 3D MT inversion at seismogenic-fault scales using data-space regularization"
  journal: Manuscript in Preparation
  volume: 
  doi: 
  year: Hopefully 2027
  image: MT.png
  description: 
  key1: Three-dimensional MT inversion can mitigate errors from 2D assumptions, but its computational cost limits applications to localized areas.
  key2: We adapt a previously developed data-space regularization framework to enable efficient 3D MT inversion at the scale of seismogenic faults.
  key3: We validate the method using 3D MT data acquired near the Gyeongju and Pohang earthquake source regions in Republic of Korea.
  authors: <strong>Yonghyun Chung</strong> and Tae Jong Lee
