- title: "Data-space first-arrival traveltime tomography using damped wavefields"
  journal: Manuscript in Preparation
  volume: 
  doi: 
  year: Hopefully 2027
  image: FATT.png
  description: 
  key1: Damped wavefields suppress later arrivals and provide finite-frequency sensitivity to first-arrival traveltimes, reducing reliance on high-frequency ray approximations.  
  key2: Formulating the inversion in data space enables a computationally efficient Gauss-Newton solution.
  key3: By combining these advantages, the proposed method improves computational efficiency and the spatial resolution of the reconstructed images, as demonstrated using field data.
  authors: <strong>Yonghyun Chung</strong> and Sukjoon Pyun
